version: "3.9"
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: analytics_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: tech@1234
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql://postgres:tech%401234@db:5432/analytics_db
      JWT_SECRET: change-me
      ACCESS_TOKEN_EXPIRE_MINUTES: "720"
      BOOTSTRAP_TOKEN: change-me
      ADMIN_USERNAME: admin.user@zopper.com
      ADMIN_PASSWORD: admin123
      EMPLOYEE_USERNAME: employee.user@zopper.com
      EMPLOYEE_PASSWORD: employee123
      UVICORN_WORKERS: "1"
      OLLAMA_API_URL: http://ollama:11434/api/generate
      OLLAMA_TIMEOUT_SECONDS: "20"
      OLLAMA_KEEP_ALIVE: "30m"
      OLLAMA_PREWARM: "1"
      OLLAMA_DEFAULT_MODEL: gemma2:2b
      CHATCARDS_MODEL: gemma2:2b
      CHATBOT_MODEL: gemma2:2b
      CHATBOT_TEMPERATURE: "0.15"
      CHATBOT_PREWARM_TIMEOUT_SECONDS: "45"
      CHATBOT_TIMEOUT_SECONDS: "35"
      CHATBOT_RETRY_TIMEOUT_SECONDS: "16"
      CHATBOT_HISTORY_LIMIT: "6"
      CHATBOT_HISTORY_CHAR_LIMIT: "280"
      CHATBOT_MESSAGE_CHAR_LIMIT: "900"
      CHATBOT_MAX_NUM_PREDICT: "320"
      CHATBOT_SMALL_NUM_PREDICT: "120"
      CHATBOT_MEDIUM_NUM_PREDICT: "180"
      CHATBOT_LARGE_NUM_PREDICT: "260"
      CHATBOT_RETRY_NUM_PREDICT: "72"
      CHATBOT_REPAIR_NUM_PREDICT: "96"
      CHATBOT_NUM_CTX: "1024"
      CHATBOT_CACHE_TTL_SECONDS: "180"
      CHATBOT_CACHE_MAX_ITEMS: "256"
      ENABLE_GRAPH_INSIGHTS: "1"
      ENABLE_CHATBOT: "1"
    ports:
      - "8000:8000"
    depends_on:
      - db
      - ollama

  frontend:
    build:
      context: ./frontend/my-app
      args:
        NEXT_PUBLIC_API_BASE: http://localhost:8000
    environment:
      NEXT_PUBLIC_API_BASE: http://localhost:8000
      NEXT_PUBLIC_CHATBOT_TIMEOUT_MS: "60000"
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pg_data:
  ollama_data:
